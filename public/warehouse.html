<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouse · Zip Packers</title>
  <link rel="icon" href="/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="topbar"><div class="inner">
    <a class="brand" href="/"><img class="logo" src="/brand/logo.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement(&quot;span&quot;),{className:&quot;dot&quot;}))"> Zip Packers</a>
    <span class="pill">Warehouse</span>
    <span class="spacer"></span>
    <button id="logout" class="btn sm" hidden>Sign out</button>
  </div></div>

  <div class="container">
    <section id="login" class="card" style="max-width:420px;margin:40px auto">
      <h1>Warehouse sign in</h1>
      <p class="muted">Enter the warehouse passcode.</p>
      <form id="loginForm" class="stack">
        <div><label for="pass">Passcode</label><input type="password" id="pass" required aria-required="true" autocomplete="current-password"></div>
        <button class="btn primary" type="submit" style="width:100%">Continue</button>
      </form>
    </section>

    <section id="app" hidden>
      <div class="tabs">
        <button class="tab active" data-tab="orders">Orders to fulfil</button>
        <button class="tab" data-tab="clients">Clients</button>
      </div>

      <div id="tab-orders">
        <div class="card">
          <div class="row" style="justify-content:space-between;margin-bottom:10px">
            <h2 style="margin:0">Order queue</h2>
            <div class="row toolbar">
              <select id="statusFilter" style="width:auto" title="Status">
                <option value="label_ready">Ready to print</option>
                <option value="new">Awaiting label</option>
                <option value="printed">Printed</option>
                <option value="all">All statuses</option>
              </select>
              <select id="typeFilter" style="width:auto" title="Item type"><option value="">All item types</option></select>
              <label class="row" style="margin:0;gap:6px;font-size:13px">From <input type="date" id="fromDate" style="width:auto"></label>
              <label class="row" style="margin:0;gap:6px;font-size:13px">To <input type="date" id="toDate" style="width:auto"></label>
              <button id="clearDates" class="btn sm" type="button" title="Clear dates">Clear dates</button>
              <select id="sortOrder" style="width:auto" title="Sort by date">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
              </select>
              <button id="refresh" class="btn sm" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg> Refresh</button>
            </div>
          </div>
          <div id="orders"></div>
        </div>
      </div>

      <div id="tab-clients" hidden>
        <div class="grid cols-2">
          <div class="card">
            <h2>Add a client</h2>
            <form id="clientForm" class="stack">
              <div><label for="cName">Business name <span class="req" aria-hidden="true">*</span></label><input type="text" id="cName" required aria-required="true"></div>
              <div><label for="cEmail">Email (optional)</label><input type="email" id="cEmail" autocomplete="email"></div>
              <button class="btn primary" type="submit">Create client &amp; access code</button>
            </form>
          </div>
          <div class="card">
            <h2>Clients</h2>
            <div id="clients"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="modalBg" class="modal-bg"><div class="modal" id="modal"></div></div>

  <script src="/js/common.js"></script>
  <script src="/js/warehouse.js"></script>
</body>
</html>
